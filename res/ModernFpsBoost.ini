;  [EnvMapCache] Кеш отражений машин
; ----------------------------------------------------------------------------
;  Что жрёт: ~0.5-2% кадра (CLinkedUpgradeList::SetEnvMapCoeff → RpClumpForAllAtomics).
;
;  Почему: каждый кадр для каждой видимой машины игра обходит все её детали и
;  материалы, чтобы выставить целочисленный уровень отражений — даже когда он
;  не изменился с прошлого кадра.
;
;  Как оптимизируется: последнее значение кешируется по модели машины (обновление
;  раз в секунду); лишние обходы деталей пропускаются. Картинка та же.
[EnvMapCache]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [CursorCenterFix] Реже центрировать системный курсор (SetCursorPos)
; ----------------------------------------------------------------------------
;  Что жрёт: ~0.9% кадра на высоком FPS (win32u!NtUserSetCursorPos).
;
;  Почему: GTA SA читает мышь через DirectInput, но всё равно каждый кадр
;  вызывает системный SetCursorPos в центр окна (500-1000 переходов в ядро/с).
;
;  Как оптимизируется: повторные вызовы в те же координаты выполняются не чаще
;  раза в interval_ms (по умолчанию 8 мс = 125 Гц). На сенсу и инпутлаг не влияет.
[CursorCenterFix]
; 1 = включён, 0 = выключен
enabled=1
; минимальный интервал между повторными SetCursorPos в те же координаты, мс (0-32)
interval_ms=8

; ----------------------------------------------------------------------------
;  [PlayerTagState] Ленивый рендер ников и полосок HP SA-MP
; ----------------------------------------------------------------------------
;  Что жрёт: ~1-2.5% кадра (CPlayerTags::Begin/EndHealthBar + Begin/EndLabel).
;
;  Почему: каждый кадр SA-MP сохраняет и восстанавливает полный StateBlock
;  D3DSBT_ALL (~200 стейтов D3D9) дважды — для полосок HP и для ников — даже
;  если в кадре нет ни одного видимого игрока.
;
;  Как оптимизируется: Begin* вызывается только перед первой реальной отрисовкой
;  ника или полоски HP в кадре; пустые проходы полностью пропускаются. Без потерь.
[PlayerTagState]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [LuaMemProtectCache] Кеш VirtualProtect / VirtualQuery для MoonLoader
; ----------------------------------------------------------------------------
;  Что жрёт: ~1.5-2% кадра (ntdll!ZwProtectVirtualMemory + ZwQueryVirtualMemory).
;
;  Почему: когда Lua-скрипты в цикле пишут в память через memory.write(..., true),
;  MoonLoader на каждую запись делает 3 системных вызова Windows: VirtualQuery,
;  VirtualProtect(RWX) и VirtualProtect(назад) со сбросом TLB.
;
;  Как оптимизируется: страницы, открытые MoonLoader на запись в главном потоке,
;  кешируются на 2 секунды и не переключаются туда-сюда каждый кадр. Без потерь.
[LuaMemProtectCache]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [CMatrixSSE] Повороты и умножение игровых матриц CMatrix на SSE2
; ----------------------------------------------------------------------------
;  Что жрёт: ~2-9% кадра (SetRotateX/Y/Z, CMatrix::operator*, MultiplyMatrixWithVector).
;
;  Почему: GTA SA строит и умножает CMatrix скалярными x87-инструкциями и зовёт
;  оба x87 fcos + fsin (~150 тактов) даже когда угол поворота равен 0.
;
;  Как оптимизируется: нулевые углы без тригонометрии, остальные — быстрый SSE2
;  sin/cos, умножение матриц и векторов по 4 числа за инструкцию. Без потерь.
[CMatrixSSE]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [OcclusionOff] Отключить программную софт-окклюзию 2004 года (COcclusion)
; ----------------------------------------------------------------------------
;  Что жрёт: до 15-20% всего кадра в плотных районах города (COcclusion::ProcessBeforeRendering,
;  ProcessOneOccluder, ProcessLineSegment, CalcScreenCoors, DoesInfiniteLineTouchScreen).
;
;  Почему: под PlayStation 2 игра каждый кадр вращает и проецирует коробки-окклюдеры
;  зданий на процессоре, чтобы сэкономить немного работы слабой видеокарте.
;  На современном ПК этот расчёт на CPU съедает в разы больше, чем экономит GPU.
;
;  Как оптимизируется: NumActiveOccluders обнуляется (как в интерьерах), видимость
;  решается аппаратным Z-буфером видеокарты. Картинка идентична.
[OcclusionOff]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [ColBoxSSE] Сферы и боксы коллизий на SSE2 (TestSphereBox + GetIsTouching)
; ----------------------------------------------------------------------------
;  Что жрёт: ~3-4% кадра (GetIsTouching ~2%, CCollision::TestSphereBox ~1.3%).
;
;  Почему: перед проверкой треугольников игра тысячи раз за кадр проверяет
;  пересечение сфер и боксов скалярным x87 с 6 fnstsw ax и повторным поиском
;  в таблице моделей.
;
;  Как оптимизируется: TestSphereBox — 6 векторных инструкций SSE2 без ветвлений;
;  GetIsTouching — встроенный расчёт центра сферы и дистанции в XMM-регистрах.
[ColBoxSSE]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [ObjectDrawLastFast] Быстрый CObjectPool::DrawLast в SA-MP
; ----------------------------------------------------------------------------
;  Что жрёт: ~1.2% кадра (samp+0F720).
;
;  Почему: каждый кадр SA-MP через _chkstk выделяет и обнуляет 8000 байт на
;  стеке (rep stosd × 2000), даже если drawLast-объектов 0, а потом сортирует
;  их пузырьком O(N^2) на x87.
;
;  Как оптимизируется: убрано обнуление 8 КБ, сортировка через std::sort.
[ObjectDrawLastFast]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [StreamMemBoost] Расширенный пул ОЗУ стриминга (512 МБ вместо 13-50 МБ)
; ----------------------------------------------------------------------------
;  Что жрёт: микрофризы подгрузки и лишний CPU/диск/Vulkan при езде по городу.
;
;  Почему: GTA SA ограничивает память моделей и текстур 13-50 МБ, постоянно
;  выгружая и заново читая карту/машины/скины.
;
;  Как оптимизируется: пул стриминга увеличивается до memory_mb (по умолчанию
;  2048 МБ, до 3584 МБ в меню F9; без LAA автоматически ограничивается 1400 МБ).
[StreamMemBoost]
; 1 = включён, 0 = выключен
enabled=1
; лимит памяти стриминга, МБ (128-3584; 3584 = макс. безопасный для 32-бит LAA)
memory_mb=2048


; ----------------------------------------------------------------------------
;  [MessagePumpFix] Умный опрос очереди сообщений Windows (PeekMessageA)
; ----------------------------------------------------------------------------
;  Что жрёт: до 10-11% всего кадра на высоком FPS (NtUserPeekMessage ~5.4% +
;  цепочка хуков DINPUT8 / NVIDIA / MoonLoader внутри PeekMessageA ~5%).
;
;  Почему: главный цикл GTA SA (0x748A57) дёргает PeekMessageA на каждом кадре
;  (700-1000 раз/с), прогоняя каждый раз переход в ядро Windows.
;
;  Как оптимизируется: перед входом в ядро проверяется GetInputState() в usermode
;  (5 тактов, 0 системных вызовов) — любое нажатие клавиши или клик будит очередь
;  мгновенно (0 мс задержки). Прицел мышью идёт через DirectInput и не зависит от
;  PeekMessage. В остальное время очередь проверяется раз в interval_ms (3 мс = 333 Гц).
[MessagePumpFix]
; 1 = включён, 0 = выключен
enabled=1
; интервал опроса очереди без нажатий клавиш, мс (0-8; 3 = 333 Гц)
interval_ms=3

; ----------------------------------------------------------------------------
;  [SilentPatchObjectFix] Убрать мёртвый цикл 256× конструктора в SilentPatch
; ----------------------------------------------------------------------------
;  Что жрёт: ~2.0% всего кадра в сценах с объектами SA-MP (SilentPatchSA.asi).
;
;  Почему: хук CObject::Render в SilentPatchSA.asi на КАЖДЫЙ рисуемый объект
;  256 раз в цикле вызывает конструктор std::pair для обнуления 2 КБ массива на
;  стеке ещё до проверки, нужен ли он (для 99.9% объектов не нужен, а в 0.1%
;  элементы всё равно сначала пишутся подряд и читаются только до count).
;
;  Как оптимизируется: мёртвый цикл обнуления удаляется после проверки точной
;  сигнатуры байтов SilentPatchSA.asi. Поведение на 100% идентично.
[SilentPatchObjectFix]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [SampKeyPollCache] Кеш опроса клавиш F1/F5/F10 (GetAsyncKeyState)
; ----------------------------------------------------------------------------
;  Что жрёт: ~0.7-1.1% кадра (win32u!NtUserGetAsyncKeyState × 3 на каждом кадре).
;
;  Почему: рендер-хук SA-MP каждый кадр трижды зовёт GetAsyncKeyState для F5,
;  F10 и F1 (2000-3000 системных вызовов/с), плюс SAMPFUNCS и mousefix.
;
;  Как оптимизируется: состояние клавиши кешируется на interval_ms (4 мс = 250 Гц),
;  бит одиночного нажатия 0x0001 сбрасывается на попадании в кеш. Без потерь.
[SampKeyPollCache]
; 1 = включён, 0 = выключен
enabled=1
; интервал кеша GetAsyncKeyState, мс (0-16; 4 = 250 Гц)
interval_ms=4

