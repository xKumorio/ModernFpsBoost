; ============================================================================
;  ModernFpsBoost.asi — оптимизация FPS для GTA SA + SA-MP 0.3.7 R1-R5 / 0.3.DL
; ============================================================================
;  Каждый фикс включается отдельно: 1 = включён, 0 = выключен.
;  Изменения применяются после перезапуска игры.
;  Проценты ниже — доля времени главного потока игры (кадра) в толпе ~100 игроков,
;  замерено профайлером (xperf, сэмплы со стеками) на слабом CPU.
;  Лог: ModernFpsBoost.log рядом с .asi.
;  Меню в игре: 7. Разработчик: Softik Inquisitor (https://vk.ru/miurawr).
;  © 2026 Softik Inquisitor. Все права защищены, копирование запрещено.

[Language]
; 0 = Русский (по умолчанию), 1 = English
; Если поставить 1, при следующем запуске .ini перезапишется с английскими пояснениями (настройки сохранятся)
english=0

; ----------------------------------------------------------------------------
;  [TextCache] Кеш текста SA-MP (ники, 3D-тексты, чат, килл-лист)
; ----------------------------------------------------------------------------
;  Что жрёт: 19–30% кадра в толпе (самая большая статья, больше коллизий
;  и отрисовки моделей). После фикса: ~5–8%.
;
;  Почему: SA-MP рисует текст через ID3DXFont::DrawText из d3dx9_25.dll.
;  Каждую строку он рисует 5 раз (4 прохода чёрной тени со сдвигом ±1 пиксель
;  + сам текст) и ещё раз меряет (DT_CALCRECT) для центрирования. А d3dx
;  на КАЖДЫЙ вызов заново прогоняет строку через Uniscribe (ScriptShape /
;  ScriptPlace → textshaping.dll, полный OpenType-шейпинг). Сами буквы рисуются
;  быстро (<1%), всё время уходит на пересчёт раскладки одних и тех же ников
;  сотни раз за кадр.
;
;  Как оптимизируется: первый вызов строки идёт в настоящий d3dx, плагин
;  записывает, какие буквы, из каких текстур и в какие позиции тот нарисовал.
;  Следующие вызовы той же строки тем же шрифтом повторяют эти же команды
;  отрисовки со сдвигом на новую позицию и текущим цветом — без шейпинга.
;  Начало блока текста считается точно по формуле d3dx (DT_CENTER/RIGHT/VCENTER/
;  BOTTOM/RTL), позиции букв во float совпадают побитово.
;  Без потери качества: картинка идентична, цвета {RRGGBB}, тени и прозрачность
;  работают как раньше.
;
;  Защита: каждый N-й повтор сверяется с настоящим d3dx вхолостую; при любом
;  расхождении кеш сам выключается и пишет MISMATCH в лог.
[TextCache]
; 1 = включён, 0 = выключен
enabled=1
; сверять каждый N-й повтор с настоящим d3dx (0 = никогда). 256 почти ничего не стоит
check_every=256
; 1 = сверять КАЖДЫЙ вызов (только для отладки, съедает весь выигрыш)
verify_all=0

; ----------------------------------------------------------------------------
;  [ColPlaneCache] Кеш плоскостей треугольников коллизии
; ----------------------------------------------------------------------------
;  Что жрёт: ~1.5% кадра (CCollisionData::CalculateTrianglePlanes + CColTrianglePlane::Set).
;
;  Почему: перед проверкой столкновений с моделью (здание, объект) GTA считает
;  плоскость каждого её треугольника и держит готовые плоскости в кеше. Но кеш
;  всего на 50 моделей (CCollision::Init, 0x416260). В толпе на большой карте с
;  кучей объектов его не хватает: плоскости выкидываются и через кадр считаются
;  заново, по кругу.
;
;  Как оптимизируется: кеш увеличивается до size моделей. Плоскости зависят
;  только от треугольников модели, поэтому результат тот же самый — меняется
;  только время. Без потерь. Память: пара мегабайт.
[ColPlaneCache]
; 1 = включён, 0 = выключен
enabled=1
; сколько моделей коллизии держать с готовыми плоскостями (в игре 50)
size=1000

; ----------------------------------------------------------------------------
;  [RemotePedPhysics] Чужие игроки без физики столкновений (кинематика)
; ----------------------------------------------------------------------------
;  Что жрёт: ~10% кадра в толпе (CWorld::Process → CPhysical::ProcessCollision →
;  ProcessColModels → TestSphereTriangle) + часть IsInAir. Самая большая статья
;  движка.
;
;  Почему: каждый чужой игрок — для GTA обычный CPlayerPed, и она каждый кадр
;  проверяет его сферы против треугольников карты, объектов и машин вокруг.
;  Причём для игроков GTA не пропускает эту проверку даже когда пед стоит
;  на месте (условие IsPlayer() в ProcessCollision), так что AFK-толпа жрёт
;  столько же, сколько бегающая.
;  При этом SA-MP чужому педу высоту не задаёт: по пакету он только телепортирует
;  его, если тот уехал >2 м по X/Y или >1 м по Z, иначе ставит скорость из пакета
;  + 10% ошибки. Всё остальное — локальная физика GTA (гравитация + столкновения).
;
;  Как оптимизируется: для чужих игроков дальше min_distance метров физика
;  столкновений и гравитация выключаются — пед двигается только по скорости из
;  пакетов и поправкам SA-MP (кинематика). Проверка «в воздухе ли он» для них
;  тоже не делается. Модель коллизии педа остаётся включённой: твои пули,
;  машина и удары по нему работают как раньше. Твой пед не трогается.
;
;  Чем платишь: дальние игроки на лестнице/склоне могут чуть висеть или утопать
;  в земле; когда подходишь ближе min_distance, включается полная физика и всё
;  исправляется само; падение с высоты у чужих — без анимации падения GTA;
;  серфинг на машинах может выглядеть хуже. Если рядом это заметно — поставь
;  min_distance=20..40: ближние будут с полной физикой, дальние — кинематика.
[RemotePedPhysics]
; 1 = включён, 0 = выключен
enabled=1
; с какой дистанции (метры от твоего педа) чужие игроки становятся кинематическими.
; 0 = все чужие игроки (максимум FPS), 20 = рядом полная физика без багов
min_distance=20

; ----------------------------------------------------------------------------
;  [RemoteInAir] Проверка «в воздухе ли пед» для чужих игроков
; ----------------------------------------------------------------------------
;  Что жрёт: ~4.5% кадра в толпе (CPedGeometryAnalyser::IsInAir →
;  CWorld::ProcessVerticalLine → ProcessLineTriangle).
;
;  Почему: каждый чужой игрок в SA-MP для GTA — обычный локальный пед, и её
;  сканер событий ИИ (CEventScanner / CEventInAir) каждый кадр для каждого педа,
;  который не помечен «стоит на земле», пускает луч вниз сквозь здания, машины и
;  объекты (а если не попал — ещё проверку сферой), чтобы решить, не начать ли
;  анимацию падения. 100 игроков — 100 лучей в каждом кадре.
;
;  Как оптимизируется: для ЧУЖИХ педов результат запоминается, пока пед стоит
;  на месте (позиция совпадает побитово) и не дольше max_age_ms. Двигающиеся
;  игроки проверяются каждый кадр как раньше. Твой пед не трогается вообще.
;  Почти без потерь: если под неподвижным игроком за max_age_ms пропадёт опора
;  (уехала машина, удалили объект), анимация падения начнётся на это время позже.
[RemoteInAir]
; 1 = включён, 0 = выключен
enabled=1
; максимальный возраст запомненного результата, мс
max_age_ms=250

; ----------------------------------------------------------------------------
;  [RefPool] Пул ссылок между объектами игры (CReferences)
; ----------------------------------------------------------------------------
;  Что жрёт: ~30% кадра в сильной толпе (CEntity::RegisterReference →
;  CEntity::PruneReferences по всем педам, машинам и объектам).
;
;  Почему: когда один объект игры хранит указатель на другой (пед «видит»
;  соседа, цель задачи ИИ, событие), GTA записывает ссылку в общий пул на 3000
;  штук, чтобы обнулить указатель при удалении объекта. В толпе пул забит живыми
;  ссылками, и КАЖДАЯ новая ссылка запускает чистку всех педов, машин и объектов,
;  которая ничего не находит. Ссылка при этом теряется, указатель потом может
;  смотреть на удалённый объект (это ещё и вылеты).
;
;  Как оптимизируется: плагин раз в секунду сам чистит устаревшие ссылки (как
;  игра делала при пустом пуле), а если мест нет — добавляет в пул новый блок на
;  block ссылок (8 байт на ссылку). Полной чистки на каждую ссылку больше нет,
;  и ссылки не теряются.
;  Без потерь: игра работает со ссылками так же, их просто хватает.
[RefPool]
; 1 = включён, 0 = выключен
enabled=1
; ссылок в одном добавляемом блоке
block=4096
; максимум добавочных блоков (64 x 4096 = 262144 ссылки, 2 МБ)
max_blocks=64


; ----------------------------------------------------------------------------
;  [PedDrawDistance] Дальность прорисовки чужих игроков
; ----------------------------------------------------------------------------
;  Что жрёт: отрисовка каждого видимого игрока — десятки вызовов видеокарты и
;  скиннинг; в толпе с игроками вдали это заметная часть кадра.
;
;  Почему: GTA рисует игрока на любом расстоянии, на котором его прислал сервер
;  (обычно до 200-300 м), хотя дальше ~150 м он — пара пикселей.
;
;  Как оптимизируется: чужие игроки дальше max_m от камеры не рисуются (вместе
;  с оружием в руках). Всё остальное — ник, синхронизация, попадания — как
;  раньше. Твой пед рисуется всегда. Хочешь видеть дальше — увеличь max_m.
[PedDrawDistance]
; 1 = включён, 0 = выключен
enabled=1
; не рисовать чужих игроков дальше стольких метров от камеры
max_m=150

; ----------------------------------------------------------------------------
;  [MatrixSSE] Умножение матриц RenderWare на SSE
; ----------------------------------------------------------------------------
;  Что жрёт: ~2.5% кадра в толпе (RwMatrixMultiply / RwMatrixTransform → x87
;  подпрограмма 0x8572A0).
;
;  Почему: RenderWare 2004 года умножает матрицы старой x87-математикой по
;  одному числу, а делает это для каждой кости каждого педа и каждой детали
;  машины, когда они двигаются — десятки тысяч раз в секунду.
;
;  Как оптимизируется: та же формула (тот же порядок сложений, те же 12 чисел,
;  флаги не трогаются) на SSE — по 4 числа за инструкцию. Подставляется через
;  таблицу функций самого RenderWare, код игры не меняется. Результат может
;  отличаться в последнем знаке после запятой — на глаз не видно.
[MatrixSSE]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [FtolSSE3] Перевод дробных чисел в целые (каждое (int)float в игре)
; ----------------------------------------------------------------------------
;  Что жрёт: ~0.5% кадра (CRT __ftol2, вызывается отовсюду в движке).
;
;  Почему: компилятор 2004 года превращал каждое (int)float в вызов функции,
;  которая сохраняет число, округляет его, загружает обратно и вручную
;  исправляет округление на отбрасывание — десятки тактов на каждое число.
;
;  Как оптимизируется: инструкция fisttp (SSE3, есть во всех процессорах с
;  2005 года) делает ровно то же самое за одну операцию. Результат тот же.
;  Без поддержки SSE3 фикс сам не включится.
[FtolSSE3]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [AnimMathSSE] Математика скелетной анимации
; ----------------------------------------------------------------------------
;  Что жрёт: ~2% кадра в толпе (CQuaternion::Slerp ~1.5%, RpHAnimIDGetIndex
;  ~0.3%).
;
;  Почему: для каждой кости каждого педа при каждом обновлении позы игра
;  дважды считает синус старой x87-инструкцией fsin (~100 тактов), а кость по
;  номеру ищет перебором всех ~32 костей.
;
;  Как оптимизируется: синус — точным многочленом (ошибка 0.000000003, меньше
;  точности float), все ветки как в оригинале; необычные значения уходят в
;  оригинальный код. Номер кости запоминается и проверяется перед выдачей.
;  Без потерь.
[AnimMathSSE]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [NametagLOSCache] Проверка «ник за стеной?» для ников и 3D-текстов
; ----------------------------------------------------------------------------
;  Что жрёт: ~7% кадра в толпе (samp.dll → ScriptCommand → интерпретатор
;  скриптов GTA → CWorld::GetIsLineOfSightClear → TestLineTriangle).
;
;  Почему: если сервер включил проверку видимости ников, SA-MP КАЖДЫЙ кадр для
;  КАЖДОГО ника и 3D-текста пускает луч от камеры до цели сквозь всю карту, и
;  делает это через скриптовый опкод 06BD IS_LINE_OF_SIGHT_CLEAR — то есть ещё
;  и через медленный интерпретатор скриптов GTA. 100 игроков + метки = сотни
;  лучей за кадр.
;
;  Как оптимизируется: ответ «видно / за стеной» запоминается на cache_ms
;  миллисекунд, пока камера и цель остаются в той же клетке 0.5 м. Если что-то
;  сдвинулось или время вышло — честная проверка как раньше.
;  Почти без потерь: ник может появиться/спрятаться за стеной на cache_ms позже.
[NametagLOSCache]
; 1 = включён, 0 = выключен
enabled=1
; сколько миллисекунд держать ответ (100 = 0.1 с; 0 = не кешировать)
cache_ms=100

; ----------------------------------------------------------------------------
;  [ObjectSkip] Лишняя ежекадровая обработка объектов маппинга
; ----------------------------------------------------------------------------
;  Что жрёт: ~2–3% кадра на сервере с маппингом (samp.dll → CObjectPool::Process
;  → CObject::Process, ~460 объектов КАЖДЫЙ кадр).
;
;  Почему: SA-MP каждый кадр для каждого серверного объекта считает расстояние
;  до камеры и решает «показать / загрузить модель / удалить». Для статичного
;  маппинга ответ почти всегда тот же, что и кадр назад.
;
;  Как оптимизируется: расстояние до объекта не может измениться больше, чем
;  сдвинулась камера. Поэтому неподвижный и ни к чему не прикреплённый объект
;  перепроверяется, только когда камера сдвинулась настолько, что могла пересечь
;  его границу дальности (с запасом 0.5 м), или раз в skip_ms. Объект сдвинули,
;  сменили модель/дальность, он движется или прикреплён — обрабатывается каждый
;  кадр как раньше. Объекты вне дальности с ещё не удалённой моделью — тоже.
;  Без видимых потерь: появление/исчезновение на границе дальности то же самое.
[ObjectSkip]
; 1 = включён, 0 = выключен
enabled=1
; не дольше скольких миллисекунд держать ответ для одного объекта
skip_ms=100

; ----------------------------------------------------------------------------
;  [PlayerLoop] Обход всех игроков сервера каждый кадр
; ----------------------------------------------------------------------------
;  Что жрёт: ~1.5-2% кадра на заполненном сервере (samp.dll CPlayerPool::Process
;  → CRemotePlayer::Process ~950 раз за кадр).
;
;  Почему: SA-MP каждый кадр вызывает обработку для КАЖДОГО подключённого
;  игрока, хотя у тех, кто далеко (не застримлен), она сразу выходит. Дорого не
;  само действие, а чтение из памяти: два промаха кэша на каждого игрока.
;
;  Как оптимизируется: сначала одним проходом с упреждающей загрузкой памяти
;  (все промахи идут параллельно) собираются игроки, у которых есть пед, и
;  обработка вызывается только для них — тем же кодом SA-MP, с той же защитой
;  от исключений. Без потерь: у пропущенных обработка и так ничего не делала.
[PlayerLoop]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [ObjectFindCache] Поиск объекта SA-MP по объекту GTA при отрисовке
; ----------------------------------------------------------------------------
;  Что жрёт: ~1% кадра на картах с объектами (samp.dll CObjectPool::Find).
;
;  Почему: перед отрисовкой каждого объекта SA-MP ищет «свой» объект перебором
;  всех слотов пула (до 1000, по промаху кэша на каждый), и так ~200 раз за кадр
;  в двух пулах.
;
;  Как оптимизируется: ответ запоминается для пары «пул + объект GTA» и
;  проверяется перед использованием: найденный объект должен быть всё ещё в том
;  же слоте с тем же объектом GTA; «не найден» действует, пока на месте объекта
;  GTA не создан новый. Иначе — честный перебор как раньше. Без потерь.
[ObjectFindCache]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [UnprotectCache] Снятие защиты памяти SA-MP каждый кадр
; ----------------------------------------------------------------------------
;  Что жрёт: ~1.5% кадра в толпе (samp.dll → VirtualProtect ~140 раз за кадр).
;
;  Почему: SA-MP для каждого игрока каждый кадр подменяет кусочки кода GTA и
;  перед каждой записью просит Windows разрешить запись в эту память. Это
;  системный вызов (в 32-битной игре на 64-битной Windows — ещё и через
;  прослойку WoW64), хотя память стала записываемой ещё при первом вызове и
;  SA-MP её обратно не закрывает.
;
;  Как оптимизируется: страница, которой разрешили запись меньше секунды назад,
;  повторно не открывается — сразу ответ «готово». Раз в секунду и для других
;  потоков — честный вызов Windows как раньше. Без потерь.
[UnprotectCache]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [ObjectPrefetch] Цикл ников и полосок здоровья SA-MP
; ----------------------------------------------------------------------------
;  Что жрёт: ~0.3-0.5% кадра в толпе (samp.dll, цикл ников по всем игрокам).
;
;  Почему: цикл по очереди читает данные каждого игрока, и каждое чтение —
;  промах кэша, которые идут строго один за другим (процессор ждёт память).
;
;  Как оптимизируется: перед циклом данные всех игроков запрашиваются у памяти
;  заранее и разом (prefetch), промахи идут параллельно. Сам цикл — код SA-MP
;  без изменений. Без потерь. (Prefetch объектов карты убран: объектов
;  слишком много, данные вытеснялись из кэша раньше, чем были нужны.)
[ObjectPrefetch]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [SearchLightCull] Прожекторы Зоны 69 строятся каждый кадр по всей карте
; ----------------------------------------------------------------------------
;  Что жрёт: ~1.5% кадра (7 прожекторов из main.scm, ~8 мкс каждый).
;
;  Почему: игра каждый кадр строит конус каждого прожектора (41 шаг с синусами,
;  корнями, нормализациями), даже если он за спиной или на другом конце карты.
;
;  Как оптимизируется: конус строится, только если попадает в кадр. Блик лампы
;  регистрируется как раньше — при повороте камеры картинка та же. Без потерь.
[SearchLightCull]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [SampfuncsDrawFast] Прослойка SAMPFUNCS на каждой отрисовке модели
; ----------------------------------------------------------------------------
;  Что жрёт: ~4-5% кадра (SAMPFUNCS.asi: отрисовка моделей, смена текстур,
;  состояний и шейдеров — всё, что игра шлёт видеокарте).
;
;  Почему: SAMPFUNCS встаёт между игрой и видеокартой, и на КАЖДУЮ отрисовку
;  модели (тысячи за кадр) спрашивает все свои плагины, не хотят ли они её
;  перехватить: для каждого плагина — поиск по дереву обработчиков. Обычно
;  никто не хочет, а время уходит.
;
;  Как оптимизируется: плагин раз в 250 мс сам смотрит, у каких функций
;  видеокарты есть обработчики у плагинов SAMPFUNCS. Для функций без
;  обработчиков вызов идёт сразу в видеокарту (ровно то, что SAMPFUNCS и так
;  сделал бы); как только кто-то зарегистрируется — снова через SAMPFUNCS.
;  Present/Reset/BeginScene/EndScene и создание ресурсов не трогаются. Без потерь.
;  Работает только с той версией SAMPFUNCS, под которую проверен.
[SampfuncsDrawFast]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [RadarBatch] Радар одним вызовом
; ----------------------------------------------------------------------------
;  Что жрёт: ~1% кадра на сервере с кучей меток и ганг-зон (CRadar::DrawMap,
;  CRadar::DrawBlips → RwIm2DRenderPrimitive).
;
;  Почему: каждая точка на радаре (с чёрной рамкой) и каждая ганг-зона —
;  отдельный вызов отрисовки через RenderWare, SAMPFUNCS и DXVK: 150-200
;  вызовов за кадр только на радар.
;
;  Как оптимизируется: пока рисуются карта радара и метки, одинаковые
;  бестекстурные фигуры подряд собираются в одну пачку и рисуются одним
;  вызовом. При любой смене состояния пачка сначала дорисовывается, так что
;  порядок и цвета те же.
[RadarBatch]
; 1 = включён, 0 = выключен
enabled=1


; ----------------------------------------------------------------------------
;  [GangZoneCull] Ганг-зоны вдали от радара
; ----------------------------------------------------------------------------
;  Что жрёт: до ~0.5% кадра на серверах с сотнями ганг-зон
;  (CGangZonePool::Draw → CRadar::DrawAreaOnRadar).
;
;  Почему: SA-MP каждый кадр отдаёт радару КАЖДУЮ зону сервера, и GTA для
;  каждой переводит 4 угла в координаты радара и обрезает их по кругу — даже
;  для зон за километры, от которых на радаре ничего не остаётся.
;
;  Как оптимизируется: зона, коробка которой не задевает область радара
;  (с запасом), пропускается до этих расчётов. На полной карте в меню паузы
;  (флаг GTA «рисуется карта») всё рисуется как раньше.
[GangZoneCull]
; 1 = включён, 0 = выключен
enabled=1


; ----------------------------------------------------------------------------
;  [ColLoadedCache] Проверка SA-MP «загружена ли коллизия под игроком»
; ----------------------------------------------------------------------------
;  Что жрёт: ~0.3% кадра в толпе (samp.dll → CColStore::HasCollisionLoaded).
;
;  Почему: SA-MP каждый кадр для каждого ближнего игрока спрашивает, загружена
;  ли под ним карта столкновений, а GTA на каждый вопрос перебирает все
;  области коллизий карты.
;
;  Как оптимизируется: ответ запоминается на 250 мс для клетки 2 м. Он
;  меняется только когда коллизия подгружается — тогда ответ обновится
;  не позже чем через четверть секунды.
[ColLoadedCache]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [SampTextMemset] Цветной текст SA-MP (чат, 3D-тексты, диалоги)
; ----------------------------------------------------------------------------
;  Что жрёт: ~0.5% кадра (samp.dll, каждая строка цветного текста).
;
;  Почему: перед выводом каждой строки SA-MP переводит её в Unicode и сначала
;  обнуляет весь буфер на 40 КБ — даже для строки из 10 букв.
;
;  Как оптимизируется: обнуляется только место сразу за строкой. Код SA-MP
;  читает буфер только до первого нуля, так что содержимое для него то же.
;  Без потерь.
[SampTextMemset]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [AccessoryFindCache] Поиск аксессуаров игроков при отрисовке объектов
; ----------------------------------------------------------------------------
;  Что жрёт: ~0.7% кадра в толпе (samp.dll CPlayerPool::FindAccessory).
;
;  Почему: для каждого объекта карты (фонари, заборы и т.п.) SA-MP каждый
;  кадр проверяет все 10 слотов аксессуаров у каждого игрока на сервере —
;  вдруг этот объект надет на кого-то.
;
;  Как оптимизируется: ответ запоминается. Найденный аксессуар перед выдачей
;  перепроверяется на месте; «не аксессуар» держится, пока объект тот же
;  (новый аксессуар — всегда новый объект), и не дольше секунды. Без потерь.
[AccessoryFindCache]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [MaterialFontCache] Фризы при появлении надписей на объектах
; ----------------------------------------------------------------------------
;  Что жрёт: разовые фризы 10-60 мс (видно как подлаг), когда рядом
;  подгружается объект с текстом сервера (вывески, таблички).
;
;  Почему: SA-MP для каждой такой надписи заново создаёт шрифт через GDI
;  Windows (медленно), рисует текст один раз и удаляет шрифт.
;
;  Как оптимизируется: созданные шрифты запоминаются по параметрам и
;  отдаются снова: следующая надпись тем же шрифтом — без создания шрифта
;  и с уже готовыми буквами. Перед сбросом устройства (Alt+Tab) кэш
;  очищается. Работает только вместе с [TextCache]. Без потерь.
[MaterialFontCache]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [AudioSleepFix] Звуки скриптов (выстрелы, попадания) без подлагов
; ----------------------------------------------------------------------------
;  Что жрёт: ~1.5 мс на каждый звук из Lua-скриптов (2 на выстрел) —
;  кадр прыгает с 6.7 до 13 мс в перестрелке.
;
;  Почему: библиотека звука BASS при запуске звука ждёт свой поток через
;  Sleep(1) прямо в потоке игры, а это минимум один тик таймера Windows.
;
;  Как оптимизируется: в потоке игры такие короткие ожидания BASS не спят
;  тик, а сразу перепроверяют готовность. Звук тот же. Без потерь.
[AudioSleepFix]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [SkyboxLogOff] Фризы от лога RealSkybox
; ----------------------------------------------------------------------------
;  Что жрёт: фризы по 20-25 мс несколько раз в минуту.
;
;  Почему: эта сборка RealSkybox постоянно пишет отладочные цифры в
;  RealSkybox.SA.log прямо в потоке игры (лог вырос до 170 000 строк), и
;  запись на диск иногда блокируется на десятки миллисекунд.
;
;  Как оптимизируется: запись в файл у RealSkybox отключена — лог больше не
;  пишется. На небо не влияет.
[SkyboxLogOff]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [LuaProfiler] Сколько ест каждый Lua-скрипт MoonLoader
; ----------------------------------------------------------------------------
;  Не оптимизация, а измерение: Lua вместе (lua51 + moonloader + moonimgui +
;  cimgui) ест ~9.5% кадра, и надо понять, какие именно скрипты.
;  Каждые interval секунд в ModernFpsBoost_lua.log пишется таблица:
;  % времени главного потока игры, мс в секунду и вызовов в секунду по каждому
;  скрипту (главный цикл wait(), события, imgui-окна — всё, что скрипт делает).
;  Нагрузка самого профайлера — два замера таймера на вызов, незаметно.
[LuaProfiler]
; 1 = включён, 0 = выключен
enabled=0
; раз во сколько секунд обновлять отчёт
interval=10

; ----------------------------------------------------------------------------
;  [SampProfiler] Сколько ест каждая функция samp.dll
; ----------------------------------------------------------------------------
;  Не оптимизация, а измерение: samp.dll ест ~15% кадра. Плагин ставит замер
;  времени на вход/выход ~45 функций SA-MP (обработка игроков, объектов, ники,
;  полоски HP, 3D-тексты, чат, текстдравы, скриптовые опкоды GTA) и каждые
;  interval секунд пишет таблицу в ModernFpsBoost_samp.log.
;  Сам замер чуть-чуть стоит (~0.1 мкс на вызов) — после замеров выключай (0).
[SampProfiler]
; 1 = включён, 0 = выключен
enabled=0
; раз во сколько секунд обновлять отчёт
interval=10

; ----------------------------------------------------------------------------
;  [Log] Отладка
; ----------------------------------------------------------------------------
[Log]
; писать в лог статистику (попадания/промахи кеша) каждые N секунд, 0 = выкл
