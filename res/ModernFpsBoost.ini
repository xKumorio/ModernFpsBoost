; ----------------------------------------------------------------------------
;  [VehicleLod] Машины вдали рисуются упрощённой моделью (МЕНЯЕТ КАРТИНКУ)
; ----------------------------------------------------------------------------
;  Что жрёт: ~14% кадра на 7 машин в кадре. Подробная модель машины — около
;  55 вызовов видеокарты (каждая деталь и материал отдельно).
;
;  Почему: игра рисует подробную модель до ~100 м и только дальше включает
;  встроенную упрощённую (1-2 вызова).
;
;  Как оптимизируется: упрощённая модель включается уже после lod_m. Вдали
;  машины выглядят проще (без салона, стёкол, мелких деталей). Машины без
;  упрощённой модели (некоторые замены) рисуются как раньше.
[VehicleLod]
; 1 = включён, 0 = выключен
enabled=1
; ближе стольких метров машина подробная; меньше = больше FPS (10-150)
lod_m=30

; ----------------------------------------------------------------------------
;  [DrawDistance] Дальность прорисовки ниже игрового минимума (МЕНЯЕТ КАРТИНКУ)
; ----------------------------------------------------------------------------
;  Что жрёт: отрисовка зданий и объектов ~13% кадра и проверка видимости ~6%.
;
;  Почему: каждая модель рисуется до своей дальности, умноженной на настройку
;  «дальность прорисовки» игры, а её минимум в меню — 92%.
;
;  Как оптимизируется: дальность задаётся здесь напрямую. Меньше процент —
;  подробные здания и маппинг появляются ближе, вдали вместо них упрощённые
;  модели. Ползунок дальности в настройках игры при этом не действует.
[DrawDistance]
; 1 = включён, 0 = выключен
enabled=1
; дальность в процентах (20-180); в игре минимум 92, максимум 180. В меню F9 меняется сразу
percent=60

; ----------------------------------------------------------------------------
;  [StreamBudget] Подгрузка моделей по частям
; ----------------------------------------------------------------------------
;  Что жрёт: фриз 10-15 мс при езде и полёте, когда подгружается карта.
;
;  Почему: диск читает до 16 моделей одним запросом, а игра распаковывает их
;  все в одном кадре (текстуры, геометрия, коллизия) — 1.5-4 МБ за раз.
;
;  Как оптимизируется: за кадр распаковывается не больше budget_kb, остальное
;  в следующих кадрах в том же порядке. Модели появляются на несколько кадров
;  позже. Срочные загрузки (телепорт, спавн) идут как раньше.
[StreamBudget]
; 1 = включён, 0 = выключен
enabled=1
; сколько КБ моделей распаковывать за кадр (16-1024); меньше = ровнее кадры, но модели появляются позже
budget_kb=96

