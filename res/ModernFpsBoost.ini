;  [ModelNameLookup] Поиск модели по имени через таблицу
; ----------------------------------------------------------------------------
;  Что жрёт: фриз 20-30 мс при загрузке файла коллизий заменённого или
;  добавленного маппинга.
;
;  Почему: чтобы найти модель по имени, игра перебирает все 20000 ячеек
;  моделей, и так для каждой модели файла.
;
;  Как оптимизируется: имя ищется по таблице за одно обращение, найденное
;  сверяется с самой ячейкой. Результат тот же.
[ModelNameLookup]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [SampModelWait] SA-MP не усыпляет игру, ожидая модель объекта
; ----------------------------------------------------------------------------
;  Что жрёт: фриз от 15 мс до секунды, когда сервер создаёт объекты, моделей
;  которых ещё нет в памяти (вход на сервер, телепорт, маппинг).
;
;  Почему: SA-MP запрашивает модель и ждёт её в потоке игры — до 15 раз
;  Sleep(1). Но распаковывает модель этот же поток, а он спит: ожидание
;  ничего не даёт и повторяется для каждого объекта.
;
;  Как оптимизируется: Sleep из этого ожидания убран, те же 15 проверок
;  проходят сразу. Дальше всё как раньше.
[SampModelWait]
; 1 = включён, 0 = выключен
enabled=1

