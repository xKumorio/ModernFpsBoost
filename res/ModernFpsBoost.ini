;  [SampObjectCull] Объекты SA-MP вне экрана не рисуются
; ----------------------------------------------------------------------------
;  Что жрёт: до 10% кадра на сервере с маппингом (samp.dll → CObject::Draw).
;
;  Почему: SA-MP рисует объекты сервера сам и проверяет только дальность
;  прорисовки - объект за спиной рисуется так же, как перед глазами.
;
;  Как оптимизируется: перед отрисовкой сфера объекта проверяется по камере;
;  вне экрана SA-MP только обновляет позицию объекта.
[SampObjectCull]
; 1 = включён, 0 = выключен
enabled=1

[SampRotationSSE]
enabled=1

; ----------------------------------------------------------------------------
;  [FloorSSE4] Округление floor() и ceil() за одну инструкцию (SSE4.1)
; ----------------------------------------------------------------------------
;  Что жрёт: ~0.4% кадра (встроенные CRT floor/ceil в gta_sa.exe).
;
;  Почему: функции floor()/ceil() 2004 года на каждый вызов читают регистры
;  состояния FPU/SSE (stmxcsr + fnstcw — сброс конвейера) и вручную сдвигают
;  биты мантиссы за ~40 инструкций.
;
;  Как оптимизируется: заменяются на SSE4.1 roundsd (1 инструкция, точный
;  результат IEEE 754). Без потерь.
[FloorSSE4]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [FrustumSSE] Проверка видимости сфер и TransformPoint на SSE2
; ----------------------------------------------------------------------------
;  Что жрёт: ~1.2% кадра (CCamera::IsSphereVisible + TransformPoint).
;
;  Почему: при обходе мира игра тысячи раз за кадр проверяет попадание сфер в
;  камеру через косвенный вызов RwV3dTransformPoints и 6 x87 fcomp + fnstsw ax,
;  а TransformPoint считает и x87 fcos, и fsin (~150 тактов) даже при угле 0.
;
;  Как оптимизируется: трансформация и 4 плоскости фрустума считаются одной
;  векторной операцией SSE2; TransformPoint при угле 0 делает 3 сложения и
;  быстрый SSE2 sin/cos для остальных углов. Без потерь.
[FrustumSSE]
; 1 = включён, 0 = выключен
enabled=1

; ----------------------------------------------------------------------------
;  [ColTriSSE] Коллизии лучей и сфер с треугольниками на SSE2
; ----------------------------------------------------------------------------
;  Что жрёт: ~2-3% кадра (в толпе и при езде до 5-8%: ProcessLineTriangle и
;  TestSphereTriangle — самые горячие функции внутри gta_sa.exe).
;
;  Почему: игра распаковывает int16-нормали и вершины через стек (fild — простой
;  store-forwarding на каждой координате), проверяет дистанцию только в конце,
;  а в TestSphereTriangle до 7 раз вызывает CrossProduct и sqrt (Magnitude).
;
;  Как оптимизируется: векторная распаковка плоскостей на SSE2, раннее отсечение
;  дальних попаданий до чтения вершин и точный квадратичный тест сферы без sqrt.
;  Физика та же.
[ColTriSSE]
; 1 = включён, 0 = выключен
enabled=1

