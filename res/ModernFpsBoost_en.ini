;  Before drawing each visible ped, GTA SA multiplies ~32 bone matrices
;  (_rpD3D9SkinVertexShaderMatrixUpdate, up to 64 indirect RwMatrixMultiply
;  calls per ped) and transposes 384 floats one-by-one into shader constants.
;
;  Multiplication is inlined in SSE2 keeping the inverse matrix in XMM
;  registers, and transposition uses _MM_TRANSPOSE4_PS. 100% identical visuals.
[SkinMatrixSSE]
; 1 = enabled, 0 = disabled
enabled=1

