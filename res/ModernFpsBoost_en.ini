; ----------------------------------------------------------------------------
;  [FrameSyncFast] Fast bone hierarchy (FrameSync) (-0.7-1.2% frame)
; ----------------------------------------------------------------------------
;  Iterative ped/vehicle skeleton traversal with inline SSE2 matrix math and
;  parent LTM cache.
;
;  When updating ped poses and vehicle parts, RenderWare recursively walks the
;  RwFrame tree (_FrameSyncHierarchyRecurse), making empty recursive calls even
;  for leaf bones and indirect RwMatrixMultiply calls per bone.
;
;  Recursion is replaced by an iterative walk with memory prefetching, inline
;  SSE2 multiplication, and cached parent LTM across sibling nodes. Order and
;  result are 100% identical.
[FrameSyncFast]
; 1 = enabled, 0 = disabled
enabled=1

; ----------------------------------------------------------------------------
;  [SkinMatrixSSE] Ped skinning matrices on SSE2 (-0.5-1% frame)
; ----------------------------------------------------------------------------
;  Speeds up computing and transposing 32 bone skinning matrices per visible
