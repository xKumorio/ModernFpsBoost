name: Build ModernFpsBoost

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build ASI
        shell: cmd
        run: build.bat

      - name: Compute SHA-256
        id: hash
        shell: pwsh
        run: |
          $file = "build\ModernFpsBoostBySoftikInquisitor(vk-miurawr).asi"
          $sha = (Get-FileHash $file -Algorithm SHA256).Hash
          $size = (Get-Item $file).Length
          echo "sha256=$sha" >> $env:GITHUB_OUTPUT
          echo "size=$size" >> $env:GITHUB_OUTPUT
          Write-Host "Built $file ($size bytes), SHA-256: $sha"

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModernFpsBoost
          path: build/ModernFpsBoostBySoftikInquisitor(vk-miurawr).asi
          if-no-files-found: error

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $sha = "${{ github.sha }}"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $file = "build\ModernFpsBoostBySoftikInquisitor(vk-miurawr).asi"
          $notes = @"
          **ModernFpsBoost $tag** — оптимизация FPS для GTA:SA 1.0 US и SA-MP `0.3.7 R1 / R2 / R3-1 / R4 / R5-1 / 0.3.DL-R1`.

          ### Установка
          1. Скачайте ``ModernFpsBoostBySoftikInquisitor.vk-miurawr.asi``.
          2. Положите файл в корень папки с GTA:SA (рядом с ``gta_sa.exe``).
          3. Меню настроек и профайлеров открывается в игре по клавише **F9**.

          ### Проверка сборки из исходников
          - **Commit:** ``$sha``
          - **GitHub Actions Run:** $runUrl
          - **SHA-256:** ``${{ steps.hash.outputs.sha256 }}``
          "@
          gh release create $tag $file --title "ModernFpsBoost $tag" --notes $notes --verify-tag
