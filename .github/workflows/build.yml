name: Build ModernFpsBoost

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build ASI
        shell: cmd
        run: build.bat

      - name: Compute SHA-256
        id: hash
        shell: pwsh
        run: |
          $file = "build\ModernFpsBoostBySoftikInquisitor(vk-miurawr).asi"
          $sha = (Get-FileHash $file -Algorithm SHA256).Hash
          $size = (Get-Item $file).Length
          echo "sha256=$sha" >> $env:GITHUB_OUTPUT
          echo "size=$size" >> $env:GITHUB_OUTPUT
          Write-Host "Built $file ($size bytes), SHA-256: $sha"

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModernFpsBoost
          path: build/ModernFpsBoostBySoftikInquisitor(vk-miurawr).asi
          if-no-files-found: error

      - name: Publish Immutable Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $sha = "${{ github.sha }}"
          $hash = "${{ steps.hash.outputs.sha256 }}"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $file = "build\ModernFpsBoostBySoftikInquisitor(vk-miurawr).asi"
          $bt = [char]96
          $lines = @(
            "**ModernFpsBoost $tag**: оптимизация FPS для GTA:SA 1.0 US и SA-MP ${bt}0.3.7 R1 / R2 / R3-1 / R4 / R5-1 / 0.3.DL-R1${bt}."
            ""
            "### Установка"
            "1. Скачайте ${bt}ModernFpsBoostBySoftikInquisitor.vk-miurawr.asi${bt}."
            "2. Положите файл в корень папки с GTA:SA (рядом с ${bt}gta_sa.exe${bt})."
            "3. Меню настроек и профайлеров открывается в игре по клавише **F9**."
            ""
            "### Проверка сборки из исходников"
            "- **Commit:** ${bt}$sha${bt}"
            "- **GitHub Actions Run:** $runUrl"
            "- **SHA-256:** ${bt}$hash${bt}"
          )
          [System.IO.File]::WriteAllLines("release_notes.md", $lines, [System.Text.UTF8Encoding]::new($false))
          gh release create $tag --draft --title "ModernFpsBoost $tag" --notes-file release_notes.md --verify-tag
          gh release upload $tag $file
          gh release edit $tag --draft=false
